name: Lua checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile Lua sources
        shell: bash
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              lua5.1 -e 'assert(loadfile(arg[1]))' "$file"
            done
      - name: Run rendering benchmark
        run: lua5.1 tests/render_benchmark.lua
      - name: Run parsing benchmark
        run: lua5.1 tests/parse_benchmark.lua
      - name: Test credential handling
        run: lua5.1 tests/credentials_test.lua
